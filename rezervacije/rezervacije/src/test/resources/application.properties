# Vazi samo dok se izvrsavaju testovi. Aplikacija i dalje radi na MySQL-u
# preko src/main/resources/application.properties.
#
# sql.syntax_mys ukljucuje MySQL sintaksu u HSQLDB-u, zbog kolone slike
# koja je u entitetu Sala deklarisana kao TEXT.
spring.datasource.url=jdbc:hsqldb:mem:testdb;sql.syntax_mys=true;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.security=WARN

app.jwtSecret=kljucKojiSeKoristiSamoUTestovimaIneMoraDaBudeTajan1234567890
app.jwtExpirationMs=86400000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
